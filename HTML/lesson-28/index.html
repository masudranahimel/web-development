<!DOCTYPE html>
<html lang="en"L>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Figure and Figcaption</title>
  </head>

  <body>
    <header>
      <h1>My Portfolio</h1>
    </header>

    <main>
      <section>
        <h2>My Profile</h2>
        <figure>
          <img src="Profile.jpg" alt="Portrait of a web development student" width="300" />
        
        <figcaption>Learning web development and building projects</figcaption>
      </figure>
      </section>
    </main>
  </body>
</html>
</html>
