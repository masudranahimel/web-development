<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Accessibility</title>
  </head>

  <body>
    <header>
      <h1>HTML Accessibility</h1>
    </header>

    <main>
      <img src="profile.jpg" alt="Portrait of Masud Rana Himel" />

      <br /><br />

      <label for="email">Email</label>
      <br />

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
      />

      <br /><br />

      <button aria-label="Submit form">Submit</button>

      <br /><br />

      <button aria-label="Search">🔍</button>
      <button aria-label="Shopping bag">👜</button>
    </main>
  </body>
</html>
