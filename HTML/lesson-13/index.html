<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Audio & Video</title>
  </head>

  <body>
    <h1>HTML Audio & Video</h1>

    <h2>Audio Example</h2>
    <audio controls>
      <source src="audio/sample-audio.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <br />
    <br />

    <h2>Video Example</h2>
    <video width="500" controls>
      <source src="video/sample-video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </body>
</html>
