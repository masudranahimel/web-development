<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Tables: Colspan & Rowspan</title>
  </head>

  <body>
    <h1>HTML Tables: Colspan & Rowspan</h1>

    <h2>Colspan Example</h2>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Profession</th>
      </tr>

      <tr>
        <td>Masud Rana Himel</td>
        <td>Bangladesh</td>
        <td>Software Engineer</td>
      </tr>

      <tr>
        <td colspan="3">Total Members: 1</td>
      </tr>
    </table>

    <br />
    <br />

    <h2>Rowspan Example</h2>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Skill</th>
      </tr>

      <tr>
        <td rowspan="2">Masud Rana Himel</td>
        <td>HTML</td>
      </tr>

      <tr>
        <td>CSS</td>
      </tr>
    </table>
  </body>
</html>
